<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinotha Blouse Studio - Sir's Real Collection</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Manrope:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:'Manrope',sans-serif;background:#0A0A0A;color:#E8D5C4}
h1{font-family:'Cormorant Garamond',serif}
.gold{color:#D4AF37}.gold-bg{background:linear-gradient(135deg,#D4AF37,#F9E29C)}
.card{transition:0.5s}.card:hover{transform:translateY(-10px);box-shadow:0 20px 60px rgba(212,175,55,0.25)}
</style>
</head>
<body>
<header class="sticky top-0 z-50 bg-black/90 backdrop-blur border-b border-[#D4AF37]/20">
<div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
<div class="flex items-center gap-3">
<img src="logo.jpg" class="w-12 h-12 rounded-full border-2 border-[#D4AF37]/50 bg-white">
<div><div class="text-xl font-bold tracking-widest text-[#D4AF37]">VINOTHA</div><div class="text-[8px] tracking-widest">BLOUSE STUDIO • SIR</div></div>
</div>
<a href="https://wa.me/918778877305" class="gold-bg text-black px-6 py-2.5 rounded-full text-xs font-bold">CONTACT SIR</a>
</div>
</header>

<section class="max-w-7xl mx-auto px-6 py-10">
<div class="text-center mb-10">
<div class="inline-block border border-[#D4AF37]/30 px-4 py-1.5 rounded-full text-[10px] tracking-[0.3em] text-[#D4AF37]">9 REAL BLOUSES FROM SIR</div>
<h1 class="text-5xl md:text-6xl mt-4 text-[#F5E6C8]">Only Blouses.<br><span class="text-[#D4AF37] italic">Sir's Speciality.</span></h1>
</div>
<div id="products" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
</section>

<div id="cart" class="fixed bottom-6 right-6 bg-black border border-[#D4AF37]/40 rounded-[28px] p-6 w-[380px] hidden z-50">
<h3 class="gold text-xs font-bold">CART • <span id="count">0</span></h3>
<div id="cartItems" class="mt-4 space-y-2"></div>
<div class="mt-4 font-bold text-white">Total Rs.<span id="total">0</span></div>
<button onclick="orderWA()" class="mt-4 w-full gold-bg text-black py-4 rounded-full font-bold text-xs">ORDER TO SIR →</button>
</div>

<script>
const products=[
{name:"Royal Blue Halter Blouse",price:650,img:"blouse1.jpg"},
{name:"Mint Floral Collar Blouse",price:1200,img:"blouse2.jpg"},
{name:"Magenta Heavy Gold Blouse",price:3200,img:"blouse3.jpg"},
{name:"Pink Green Flower Blouse",price:2800,img:"blouse4.jpg"},
{name:"Teal Mirror Work Blouse",price:2200,img:"blouse5.jpg"},
{name:"Red Temple Cut Blouse",price:800,img:"blouse6.jpg"},
{name:"Pink Pearl Luxury Blouse",price:3500,img:"blouse7.jpg"},
{name:"Red Green Stone Bridal",price:3000,img:"blouse8.jpg"},
{name:"Pink Silver Floral Blouse",price:2600,img:"blouse9.jpg"}
];
let cart=[];
function render(){
document.getElementById('products').innerHTML=products.map((p,i)=>`
<div class="card bg-[#111] rounded-[24px] overflow-hidden border border-[#D4AF37]/20">
<img src="${p.img}" class="h-[380px] w-full object-cover">
<div class="p-5">
<h3 class="font-bold text-[#F5E6C8] text-[14px]">${p.name}</h3>
<span class="text-[9px] bg-[#D4AF37]/20 text-[#D4AF37] px-2 py-1 rounded-full">${p.tag}</span>
<p class="gold font-bold mt-2">Rs.${p.price}</p>
<button onclick="add(${i})" class="mt-3 w-full bg-white text-black py-3 rounded-full text-xs font-bold hover:bg-[#D4AF37]">ADD BLOUSE +</button>
</div></div>`).join('');
}
function add(i){cart.push(products[i]);document.getElementById('count').innerText=cart.length;document.getElementById('total').innerText=cart.reduce((a,b)=>a+b.price,0);document.getElementById('cartItems').innerHTML=cart.map(c=>`<div class="flex justify-between bg-white/5 px-3 py-2 rounded-full text-xs"><span>${c.name}</span><span class="text-[#D4AF37]">Rs.${c.price}</span></div>`).join('');document.getElementById('cart').classList.remove('hidden');}
function orderWA(){let m=`Vanakkam Sir! Real blouse order:%0A`;cart.forEach(c=>m+=`• ${c.name} Rs.${c.price}%0A`);m+=`Total Rs.${cart.reduce((a,b)=>a+b.price,0)}`;window.open(`https://wa.me/918778877305?text=${m}`,'_blank');}
render();
</script>
</body>
</html>
